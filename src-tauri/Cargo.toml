[package]
name = "proverka-zadaniy"
version = "1.4.1"
description = "Проверка практических работ локальной нейросетью (MCP, защита от ИИ)"
authors = ["Spezio"]
edition = "2021"

[[bin]]
name = "ProverkaZadaniy"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
ureq = "2"

[features]
default = ["custom-protocol"]
# Встраивает интерфейс (папку ui) прямо в .exe
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"
